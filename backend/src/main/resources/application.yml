spring:
  application:
    name: music-catalog-insights

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    default-property-inclusion: non_null

  cache:
    cache-names: itunesSearch
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

---
# DEV PROFILE: H2 in-memory, zero setup
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:musiccatalog;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-1234567890-abcdefghijklmnop}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  itunes:
    base-url: https://itunes.apple.com
  ai:
    # Optional: if set, the AI insight service will call an external LLM (OpenAI-compatible).
    # If left blank, the app falls back to the built-in heuristic insight engine.
    provider-api-key: ${AI_PROVIDER_API_KEY:}
    provider-url: ${AI_PROVIDER_URL:}

---
# PROD PROFILE: PostgreSQL 
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/musiccatalog}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  itunes:
    base-url: https://itunes.apple.com
  ai:
    provider-api-key: ${AI_PROVIDER_API_KEY:}
    provider-url: ${AI_PROVIDER_URL:}
